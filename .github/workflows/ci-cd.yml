# Aura CI/CD
#
#   push / PR ─► backend tests (Postgres + Redis)          ┐
#              ─► frontend lint + types + build            ├─ these are the GitHub checks Render waits for
#              ─► Docker build of each image that changed  ┘
#   Render (render.yaml: autoDeployTrigger checksPass + buildFilter) then deploys ONLY the service whose folder
#   changed, and ONLY if every check above passed. A failed check means no deploy.
#   Optional: images are also pushed to Docker Hub when DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets exist.
#   Manual: "Run workflow" → smoke_test=true checks the live site.
name: CI/CD

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:
    inputs:
      smoke_test: { description: "Check the live production site", type: boolean, default: false }

concurrency: { group: "${{ github.workflow }}-${{ github.ref }}", cancel-in-progress: true }
permissions: { contents: read }

jobs:
  changes:
    name: What changed?
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      frontend: ${{ steps.f.outputs.frontend }}
      dockerhub: ${{ steps.d.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            backend: ['backend/**', '.github/workflows/**']
            frontend: ['frontend/**', '.github/workflows/**']
      - id: d
        env: { DH: "${{ secrets.DOCKERHUB_TOKEN }}" }
        run: echo "enabled=$([ -n "$DH" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  backend-test:
    name: Backend · tests
    needs: changes
    timeout-minutes: 45
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: aura, POSTGRES_PASSWORD: aura, POSTGRES_DB: aura }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U aura" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    defaults: { run: { working-directory: backend } }
    env:
      DJANGO_SECRET_KEY: ci-only-not-secret-0123456789abcdefghijklmnopqrstuvwxyz
      DATABASE_URL: postgresql://aura:aura@localhost:5432/aura
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/requirements.txt }
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg tesseract-ocr libsndfile1 espeak-ng
      - name: Python packages (CPU PyTorch)
        run: |
          TORCH=$(grep -E '^torch==' requirements.txt | cut -d= -f3)
          TA=$(grep -E '^torchaudio==' requirements.txt | cut -d= -f3)
          TV=$(grep -E '^torchvision==' requirements.txt | cut -d= -f3)
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==$TORCH" "torchaudio==$TA" "torchvision==$TV"
          pip install -r requirements.txt
          pip install pytest-github-actions-annotate-failures==0.3.0 pytest-timeout==2.3.1  # annotations; no hung tests
      - name: Django checks, complete migrations, static files
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py collectstatic --noinput -v 0
      - name: Tests
        run: python -m pytest -p no:warnings -rf --timeout=180 --durations=15 --junitxml=pytest-report.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: backend-test-report, path: backend/pytest-report.xml }

  frontend-test:
    name: Frontend · lint, types, build
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b --noEmit
      - run: npm run build
        env: { VITE_API_URL: "https://api.aura.pvsairamsaketh.in" }

  docker-backend:
    name: Docker · backend image
    needs: [changes, backend-test]
    if: needs.backend-test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for the backend image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: docker/setup-buildx-action@v3
      - if: needs.changes.outputs.dockerhub == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with: { username: "${{ secrets.DOCKERHUB_USERNAME }}", password: "${{ secrets.DOCKERHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          push: ${{ needs.changes.outputs.dockerhub == 'true' && github.event_name != 'pull_request' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME || 'aura' }}/aura-backend:latest,${{ secrets.DOCKERHUB_USERNAME || 'aura' }}/aura-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  docker-frontend:
    name: Docker · frontend image
    needs: [changes, frontend-test]
    if: needs.frontend-test.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - if: needs.changes.outputs.dockerhub == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with: { username: "${{ secrets.DOCKERHUB_USERNAME }}", password: "${{ secrets.DOCKERHUB_TOKEN }}" }
      - name: "Build (multi-arch: Intel and Apple Silicon)"
        uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: linux/amd64,linux/arm64
          build-args: VITE_API_URL=https://api.aura.pvsairamsaketh.in
          push: ${{ needs.changes.outputs.dockerhub == 'true' && github.event_name != 'pull_request' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME || 'aura' }}/aura-frontend:latest,${{ secrets.DOCKERHUB_USERNAME || 'aura' }}/aura-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: The built container serves the app, SPA routes and health on Render's $PORT
        run: |
          docker buildx build --load -t aura-frontend:test --build-arg VITE_API_URL=https://api.aura.pvsairamsaketh.in --cache-from type=gha,scope=frontend frontend
          docker run -d --name fe -p 8080:10000 -e PORT=10000 -e BACKEND_HOSTPORT=example.invalid:80 aura-frontend:test
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
          curl -fsS "http://127.0.0.1:8080/messenger?s=chats" | grep -q '<div id="root">'
          docker logs fe 2>&1 | tail -5

  smoke-test:
    name: Smoke test · live site
    if: github.event_name == 'workflow_dispatch' && inputs.smoke_test
    runs-on: ubuntu-latest
    steps:
      - name: Frontend, API, same-origin /api proxy, CORS for the frontend origin
        run: |
          set -e
          curl -fsS https://aura.pvsairamsaketh.in/ | grep -q '<div id="root">'
          curl -fsS https://aura.pvsairamsaketh.in/messenger | grep -q '<div id="root">'
          curl -fsS https://api.aura.pvsairamsaketh.in/healthz | grep -q ok
          curl -fsS https://api.aura.pvsairamsaketh.in/api/health/ | grep -q '"ok"'
          curl -fsSI -H "Origin: https://aura.pvsairamsaketh.in" https://api.aura.pvsairamsaketh.in/api/auth/session/ \
            | grep -qi "access-control-allow-origin: https://aura.pvsairamsaketh.in"
          echo "live site OK"
