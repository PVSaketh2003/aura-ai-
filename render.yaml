# Render Blueprint: the complete Aura app (https://render.com/docs/blueprint-spec)
#   aura-backend   Django + Channels (Daphne), Docker build of backend/Dockerfile, 20 GB disk at /var/data
#   aura-frontend  React build served by nginx, Docker build of frontend/Dockerfile
#   aura-db        PostgreSQL 16          aura-redis  Key Value (Redis-compatible) for Django Channels
# Both services build from this GitHub repo and auto-deploy only after GitHub Actions checks pass, and only when
# their own folder changed. Values marked sync:false are secrets you type once in the Render dashboard.
services:
  - type: web
    name: aura-backend
    runtime: docker
    region: singapore
    plan: free                           # 512 MB, sleeps after 15 min idle. Voice (LOCAL_SPEECH=true) needs "pro" (4 GB).
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    buildFilter:
      paths: ["backend/**"]
    # No disk on the free plan: /var/data (ChromaDB, uploads, media) is EPHEMERAL and is reset on every deploy or
    # restart. For permanent storage use plan: starter and add:
    #   disk: { name: aura-data, mountPath: /var/data, sizeGB: 5 }
    domains:
      - api.aura.pvsairamsaketh.in
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: SETUP_CODE                   # one-time code to create the owner account (read it in the dashboard)
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: ALLOWED_HOSTS                # API domain, Render URL, and the frontend host (its nginx proxies /api links)
        value: api.aura.pvsairamsaketh.in,aura.pvsairamsaketh.in,.onrender.com
      - key: FRONTEND_ORIGINS             # CORS + CSRF trusted origins
        value: https://aura.pvsairamsaketh.in
      - key: COOKIE_DOMAIN                # one login across aura.… and api.aura.…
        value: .pvsairamsaketh.in
      - key: SECURE_COOKIES
        value: "true"
      - key: BEHIND_HTTPS_PROXY
        value: "true"
      - key: DATABASE_URL
        fromDatabase: { name: aura-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: aura-redis, property: connectionString }
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: CHROMA_PATH
        value: /var/data/app/chroma
      # --- AI: Render can't run Ollama, so the LLM + embeddings come from an OpenAI-compatible API ---
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_BASE_URL                 # e.g. https://api.openai.com/v1  or  https://api.groq.com/openai/v1
        sync: false
      - key: LLM_API_KEY                  # secret: the provider's API key
        sync: false
      - key: LLM_MODEL                    # e.g. gpt-4o-mini, llama-3.1-8b-instant
        sync: false
      - key: EMBEDDING_BASE_URL           # leave empty to use LLM_BASE_URL (needs a provider with /embeddings)
        sync: false
      - key: EMBEDDING_API_KEY            # leave empty to use LLM_API_KEY
        sync: false
      - key: EMBEDDING_MODEL              # e.g. text-embedding-3-small
        sync: false
      - key: EMBEDDING_DIM                # must match the model, e.g. 1536 for text-embedding-3-small
        sync: false
      - key: LOCAL_SPEECH                 # speech models need ~4 GB; voice is text-only until a larger plan
        value: "false"
      # --- Owner sign-up by email code (sent from pvsaketh1@gmail.com) ---
      - key: EMAIL_PROVIDER               # gmail_api (Gmail over HTTPS; works on the free plan), smtp, or brevo
        value: gmail_api
      - key: EMAIL_FROM
        value: Aura <pvsaketh1@gmail.com>
      - key: SMTP_USER
        value: pvsaketh1@gmail.com
      - key: SMTP_PASSWORD                # only for EMAIL_PROVIDER=smtp (paid instances; free plan blocks SMTP)
        sync: false
      - key: GMAIL_CLIENT_ID              # set by scripts/gmail_authorize.py --render
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: BREVO_API_KEY                # only if EMAIL_PROVIDER=brevo
        sync: false
      - key: OWNER_EMAILS                 # who may create the owner account
        value: pvsaketh1@gmail.com,pvsairamsaketh@gmail.com
      - key: SMS_BACKEND                  # "twilio" for phone sign-up; leave empty to disable phone verification
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_VERIFY_SERVICE_SID
        sync: false
      - key: WEBRTC_ICE_SERVERS           # JSON list of STUN/TURN servers for calls across networks
        value: '[{"urls":"stun:stun.l.google.com:19302"}]'

  - type: web
    name: aura-frontend
    runtime: docker
    region: singapore
    plan: free                           # nginx + static files; "starter" removes the cold start after idle
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    buildFilter:
      paths: ["frontend/**"]
    domains:
      - aura.pvsairamsaketh.in             # free workspaces get 2 custom domains: aura (app) + api.aura (API)
    envVars:
      - key: VITE_API_URL                 # public: baked into the JS at build time (no secrets here)
        value: https://api.aura.pvsairamsaketh.in

  - type: keyvalue
    name: aura-redis
    region: singapore
    plan: free                            # Channels only needs pub/sub, no persistence
    maxmemoryPolicy: noeviction
    ipAllowList: []                       # private network only

databases:
  - name: aura-db
    region: singapore
    plan: free                            # free Postgres expires 30 days after creation (upgrade to keep it)
    postgresMajorVersion: "16"
    databaseName: aura
    user: aura
    ipAllowList: []                       # private network only
